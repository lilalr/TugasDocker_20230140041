<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .card {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 380px;
        }
        .profile-img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #4a90e2;
            display: block;
            margin: 0 auto 15px;
        }
        h2 {
            margin-bottom: 24px;
            color: #333;
            text-align: center;
            font-size: 22px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            color: #555;
            font-size: 14px;
            font-weight: 600;
        }
        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 10px 12px;
            margin-bottom: 16px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            transition: border 0.3s;
        }
        input[type="text"]:focus, input[type="password"]:focus {
            border-color: #4a90e2;
            outline: none;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #4a90e2;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover { background: #357abd; }
        .error {
            color: #d9534f;
            font-size: 13px;
            margin-bottom: 12px;
            text-align: center;
            background: #fdf7f7;
            padding: 8px;
            border-radius: 4px;
        }
        .footer-text {
            text-align: center;
            margin-top: 25px;
            color: #777;
            font-size: 13px;
            line-height: 1.6;
        }
        .footer-text a {
            color: #4a90e2;
            text-decoration: none;
            font-weight: 600;
        }
        .quote {
            margin-top: 15px;
            font-style: italic;
            color: #999;
        }
    </style>
</head>
<body>
<div class="card">
    <img th:src="@{/img/fotolila.jpeg}" alt="Profile Picture" class="profile-img">

    <h2>Login Page</h2>

    <form th:action="@{/login}" method="post">
        <label>Username:</label>
        <input type="text" name="username" placeholder="Masukkan username" required>

        <label>Password:</label>
        <input type="password" name="password" placeholder="Masukkan password" required>

        <p class="error" th:if="${error}" th:text="${error}"></p>

        <button type="submit">Login</button>
    </form>

    <div class="footer-text">
        <p>Belum punya akun? <a href="#">Daftar sekarang</a></p>
        <p class="quote">"Satu langkah kecil hari ini adalah awal dari kesuksesan besar di masa depan."</p>
    </div>
</div>
</body>
</html>
